<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ポケカ スタデ100シミュレーター</title>
<style>
/* 銀のカード枠と濃紺の机。ミラーは青みの銀で表す */
:root{--bg:#eef0f4;--fg:#1b2230;--mute:#5b6577;--card:#ffffff;--line:#d5d9e2;--acc:#2f6fd6;--accfg:#fff;--mir:#2f6fd6;--mirbg:#e6efff;--warn:#b4501f;--ok:#1f8a4c;--shadow:0 1px 2px rgba(20,30,50,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--fg:#e6e9f0;--mute:#9aa3b5;--card:#1a202b;--line:#2c3446;--acc:#6ea4ff;--accfg:#0b1220;--mir:#7fb0ff;--mirbg:#1f2d47;--warn:#f0a070;--ok:#6fd49a;--shadow:0 1px 2px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;padding-bottom:40px}
header.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:1rem;margin:0;flex:1 1 auto}
.yen{font-weight:700;font-variant-numeric:tabular-nums}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
nav button[aria-selected=true]{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:16px max(12px,env(safe-area-inset-right)) 16px max(12px,env(safe-area-inset-left))}
.btn{font:inherit;padding:10px 18px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--accfg);font-weight:700;cursor:pointer}
.btn.sub{background:transparent;color:var(--acc)}.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:4px 10px;font-size:.85rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.muted{color:var(--mute)}
.packbox{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.packbox .pk{width:200px;max-width:50vw}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.tile{position:relative;min-width:0}
.cimg{position:relative;aspect-ratio:.716;border-radius:6px;overflow:hidden;background:var(--line);box-shadow:var(--shadow)}
.cimg img{width:100%;height:100%;display:block;object-fit:cover}
.cimg .fb{position:absolute;inset:0;padding:6px;font-size:.72rem;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute);word-break:break-all}
.cimg.mirror::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 58%);pointer-events:none}
.cnt{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.75);color:#fff;font-weight:700;font-size:.8rem;border-radius:6px;padding:0 6px}
.mtag{position:absolute;left:4px;top:4px;background:var(--mirbg);color:var(--mir);font-size:.65rem;font-weight:700;border-radius:4px;padding:0 5px}
.energy{aspect-ratio:.716;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:700;box-shadow:var(--shadow);font-size:.8rem;text-align:center;padding:4px}
.energy i{display:block;width:44%;aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.35);margin-bottom:6px}
.flip{animation:pop .5s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.flip{animation:none}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);min-width:0}
.decks{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.deckcard h3{margin:0 0 4px;font-size:.95rem}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:0 7px;border-radius:99px;background:var(--mirbg);color:var(--mir);margin-right:4px}
.badge.ok{background:transparent;color:var(--ok);border:1px solid var(--ok)}
.ctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.72);padding:2px 4px;border-radius:0 0 6px 6px}
.ctl button{font:inherit;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.5);border-radius:4px;width:26px;height:24px;cursor:pointer}
.ctl span{color:#fff;font-weight:700}
.sticky{position:sticky;top:52px;z-index:4;background:var(--bg);padding:6px 0}
.warn{color:var(--warn);font-weight:700}.okc{color:var(--ok);font-weight:700}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);max-width:min(92vw,440px);padding:14px}
dialog::backdrop{background:rgba(0,0,0,.6)}
[hidden]{display:none!important}
</style>
</head>

function deckItems(dk){
  // 画像名ごとの枚数にする（ミラーは指定どおり）
  var items={},mc={},me={};
  (dk.mirrorCards||[]).forEach(function(c){mc[c.id]=(mc[c.id]||0)+c.count});
  (dk.mirrorEnergy||[]).forEach(function(e){me[e.type]=(me[e.type]||0)+e.count});
  dk.cards.forEach(function(c){
    var card=CARDS[c.id];if(!card)return;
    var m=Math.min(mc[c.id]||0,c.count),mi=mirrorImage(c.id);
    if(m>0&&mi){items[mi]=(items[mi]||0)+m}else m=0;
    if(c.count-m>0)items[card[1]]=(items[card[1]]||0)+c.count-m;
  });
  dk.energy.forEach(function(e){
    var m=Math.min(me[e.type]||0,e.count);
    if(m>0){items[MIRROR_E[e.type]]=(items[MIRROR_E[e.type]]||0)+m}
    if(e.count-m>0)items["E:"+e.type]=(items["E:"+e.type]||0)+e.count-m;
  });
  return items;
}
function mirrorImage(id){var n=id-4000;if(n<=0)return null;var mi=DATA.mirror;for(var k in mi)if(mi[k]===n)return "SD100_M_"+k;return null}

  if(S.yen<PRICE)return;
  var dk=DATA.decks[Math.floor(Math.random()*DATA.decks.length)];
  S.yen-=PRICE;
  var items=deckItems(dk),total=0;
  Object.keys(items).forEach(function(k){total+=items[k];if(k.indexOf("E:")!==0)S.owned[k]=(S.owned[k]||0)+items[k]});
  S.decks.push({name:dk.name,items:items});S.current=S.decks.length-1;
  var missing=0;(dk.missing||[]).forEach(function(m){missing+=m.count});
  lastOpen={name:dk.name,no:dk.no,secret:!!dk.secret,items:items,missing:missing,missingList:(dk.missing||[]).map(function(m){return m.name+" ×"+m.count})};
  save();renderYen();renderPack();
}
function sortedKeys(items){

}

  function draw(){
    upd();inDeck.innerHTML="";var g=document.createElement("div");g.className="grid";
    sortedKeys(d.items).forEach(function(k){g.appendChild(ctlTile(k,""))});
    if(!Object.keys(d.items).length)inDeck.innerHTML="<p class='muted'>まだカードが入っていません。</p>";else inDeck.appendChild(g);
    pool.innerHTML="";var pg=document.createElement("div");pg.className="grid";
    // 基本エネルギー
    TYPES.forEach(function(t){pg.appendChild(ctlTile("E:"+t[0],""))});
    sortedKeys(S.owned).forEach(function(k){if(!(S.owned[k]>0))return;pg.appendChild(ctlTile(k," / "+S.owned[k]))});
    pool.appendChild(pg);
  }
  draw();
}
