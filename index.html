<style>
/* 銀のカード枠と濃紺の机。ミラーは青みの銀で表す */
:root{--bg:#eef0f4;--fg:#1b2230;--mute:#5b6577;--card:#ffffff;--line:#d5d9e2;--acc:#2f6fd6;--accfg:#fff;--mir:#2f6fd6;--mirbg:#e6efff;--warn:#b4501f;--ok:#1f8a4c;--shadow:0 1px 2px rgba(20,30,50,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--fg:#e6e9f0;--mute:#9aa3b5;--card:#1a202b;--line:#2c3446;--acc:#6ea4ff;--accfg:#0b1220;--mir:#7fb0ff;--mirbg:#1f2d47;--warn:#f0a070;--ok:#6fd49a;--shadow:0 1px 2px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;padding-bottom:40px}
header.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:1rem;margin:0;flex:1 1 auto}
.yen{font-weight:700;font-variant-numeric:tabular-nums}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
nav button[aria-selected=true]{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:16px max(12px,env(safe-area-inset-right)) 16px max(12px,env(safe-area-inset-left))}
.btn{font:inherit;padding:10px 18px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--accfg);font-weight:700;cursor:pointer}
.btn.sub{background:transparent;color:var(--acc)}.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:4px 10px;font-size:.85rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.muted{color:var(--mute)}
.packbox{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.packbox .pk{width:200px;max-width:50vw}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.tile{position:relative;min-width:0}
.cimg{position:relative;aspect-ratio:.716;border-radius:6px;overflow:hidden;background:var(--line);box-shadow:var(--shadow)}
.cimg img{width:100%;height:100%;display:block;object-fit:cover}
.cimg .fb{position:absolute;inset:0;padding:6px;font-size:.72rem;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute);word-break:break-all}
.cimg.mirror::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 58%);pointer-events:none}
.cnt{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.75);color:#fff;font-weight:700;font-size:.8rem;border-radius:6px;padding:0 6px}
.mtag{position:absolute;left:4px;top:4px;background:var(--mirbg);color:var(--mir);font-size:.65rem;font-weight:700;border-radius:4px;padding:0 5px}
.energy{aspect-ratio:.716;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:700;box-shadow:var(--shadow);font-size:.8rem;text-align:center;padding:4px}
.energy i{display:block;width:44%;aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.35);margin-bottom:6px}
.flip{animation:pop .5s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.flip{animation:none}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);min-width:0}
.decks{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.deckcard h3{margin:0 0 4px;font-size:.95rem}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:0 7px;border-radius:99px;background:var(--mirbg);color:var(--mir);margin-right:4px}
.badge.ok{background:transparent;color:var(--ok);border:1px solid var(--ok)}
.ctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.72);padding:2px 4px;border-radius:0 0 6px 6px}
.ctl button{font:inherit;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.5);border-radius:4px;width:26px;height:24px;cursor:pointer}
.ctl span{color:#fff;font-weight:700}
.sticky{position:sticky;top:52px;z-index:4;background:var(--bg);padding:6px 0}
.warn{color:var(--warn);font-weight:700}.okc{color:var(--ok);font-weight:700}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);max-width:min(92vw,440px);padding:14px}
dialog::backdrop{background:rgba(0,0,0,.6)}
[hidden]{display:none!important}
.pkt{width:92px}.pkt.big{width:130px}.pkb{font-size:.7rem;line-height:1.3;margin-top:2px}
.bt{display:grid;gap:10px}.hg{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
.btlog{max-height:220px;overflow:auto;font-size:.8rem}

/* ===== Swift風 ===== */
body{background:#f2f2f7}
header.top{background:transparent;border:0;position:static;justify-content:center;padding:10px 12px 4px;position:relative}
header.top h1{display:none}
header.top .yen{position:absolute;right:max(12px,env(safe-area-inset-right));top:14px;font-size:.8rem;color:var(--mute)}
nav{background:#fff;border-radius:999px;padding:6px 8px;gap:2px;box-shadow:0 1px 6px rgba(0,0,0,.08);flex-wrap:nowrap;overflow:auto;max-width:100%}
nav button{border:0;background:transparent;border-radius:999px;padding:8px 18px;font-size:1rem;white-space:nowrap}
nav button[aria-selected=true]{background:#e9e9ec;color:#1b1b1f;font-weight:500}
main.wide{max-width:none;padding:0}
@media (prefers-color-scheme:dark){body{background:#000}nav{background:#1c1c1e}nav button[aria-selected=true]{background:#3a3a3c;color:#fff}}
.bf{display:grid;width:100%;overflow:hidden;background:#f2f2f7;color:#111}
@media (prefers-color-scheme:dark){.bf{background:#000;color:#eee}}
.bmain{display:flex;flex-direction:column;min-width:0;height:100%}
.field{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
.band{display:flex;align-items:flex-start;gap:12px;padding:0 12px;overflow:hidden}
.bench{flex:1;display:flex;align-items:flex-start;min-width:0}
.active{display:flex}
.ptile{display:flex;flex-direction:column;align-items:center;flex:none;cursor:pointer;margin:0 0 0 0;padding:0 3px;touch-action:manipulation}
.pcard{position:relative;border-radius:6px}
.pcard .cimg{border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.pcard.hl,.ptile.hl .pcard{outline:4px solid #34c759;border-radius:6px}
.ptile.hl .pcard{outline:4px solid #34c759}
.php{font-size:11px;font-weight:700;margin-top:2px}
.hpbar{height:4px;background:#d8d8dc;border-radius:2px;margin:2px 0}
.hpbar i{display:block;height:100%;background:#f5c400;border-radius:2px;transition:width .5s}
.ecirc{display:flex;gap:2px;min-height:16px}
.ecirc span{width:16px;height:16px;border-radius:50%;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pex{font-size:10px;color:#8a8a90;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;min-height:14px}
.eslot{border:1px dashed rgba(128,128,128,.5);border-radius:6px;flex:none}
.strip{height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.chip{font:inherit;font-size:.75rem;background:rgba(255,149,0,.25);border:0;border-radius:8px;padding:3px 8px;cursor:pointer;color:inherit}
.chip .lnk{color:#0a7aff}
.dhint{display:none;font-size:.7rem;color:#34c759}.dhint.on{display:inline}
.hand{display:flex;justify-content:center;align-items:center;gap:4px;background:rgba(120,120,128,.12);flex:none;padding:5px 12px;overflow:hidden}
.hcard{position:relative;flex:none;border-radius:6px;opacity:.55;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.hcard.usable{opacity:1;outline:2px solid #34c759}
.hcard.dragging{opacity:.25}
.hcard .cimg{border-radius:6px}
.hcard img,.fly img{pointer-events:none;-webkit-user-drag:none}
.fly{position:fixed;width:90px;transform:translate(-50%,-50%);z-index:1000;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.side{background:#f2f2f7;display:flex;flex-direction:column;gap:8px;padding:8px;min-width:0;overflow:hidden;border-left:1px solid rgba(128,128,128,.15)}
@media (prefers-color-scheme:dark){.side{background:#1c1c1e}}
.turn{text-align:center;font-weight:700;font-size:1.15rem;margin-top:6px}
.who{text-align:center;font-weight:700;font-size:.95rem}.who.me{color:#34c759}.who.op{color:#ff9500}
.info{background:#fff;border-radius:8px;padding:6px;font-size:.72rem;line-height:1.5}
.info b{font-size:.8rem}
@media (prefers-color-scheme:dark){.info{background:#2c2c2e}}
.endbtn{font:inherit;font-weight:700;color:#fff;background:#a2754e;border:0;border-radius:10px;padding:10px;font-size:.95rem;cursor:pointer}
.endbtn:disabled{background:#999;opacity:.7;cursor:default}
.lr{display:flex;justify-content:space-between;font-size:.82rem}
.lnkbtn{font:inherit;background:none;border:0;color:#0a7aff;cursor:pointer;padding:0}.lnkbtn.red{color:#ff3b30}
.slog{font-size:10px;color:#8a8a90;white-space:pre-wrap;word-break:break-all}
.shint{font-size:10px;color:#8a8a90;text-align:center}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.zoom{background:var(--card);color:var(--fg);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.4);padding:14px;display:flex;gap:16px;max-width:min(94vw,860px);max-height:92vh;overflow:auto;align-items:flex-start}
.zimg{width:min(46vh,40vw,340px);flex:none}.zimg.small{width:min(30vh,30vw,200px)}
.zimg .cimg{border-radius:10px}
.ztext{min-width:200px;flex:1;font-size:.85rem}
.ztext p{margin:.5em 0}
.mlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.mbtn{font:inherit;text-align:left;padding:9px 10px;border-radius:8px;border:0;background:rgba(10,122,255,.15);color:inherit;cursor:pointer}
.mbtn.at{background:rgba(255,59,48,.18)}.mbtn.ab{background:rgba(255,149,0,.22)}.mbtn.rt{background:rgba(52,199,89,.2)}.mbtn.sub{background:rgba(120,120,128,.15)}
.logbox .fulllog{max-height:70vh;overflow:auto;font-size:.8rem;margin-top:6px;min-width:min(80vw,460px)}
@media (max-width:640px){.zoom{flex-direction:column;align-items:center}.zimg{width:min(50vw,220px)}}
.toast{position:fixed;left:50%;bottom:26%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 16px;border-radius:10px;z-index:900}
.banner{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);color:#fff;font-size:1.9rem;font-weight:800;padding:12px 30px;border-radius:16px;z-index:900;pointer-events:none;animation:bn 1.6s ease both}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.hitpop{position:absolute;left:0;right:0;top:35%;text-align:center;font-size:22px;font-weight:800;text-shadow:0 0 2px #fff,0 0 2px #fff;animation:hp 1.1s ease-out both;pointer-events:none;z-index:3}
@keyframes hp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
.flash{position:absolute;inset:0;background:rgba(255,0,0,.55);border-radius:6px;animation:fl .6s ease-out both;pointer-events:none}
@keyframes fl{to{opacity:0}}
.burst{position:absolute;inset:0;border:5px solid #ffd60a;border-radius:8px;animation:bs 1.1s ease-out .2s both;pointer-events:none;display:flex;align-items:flex-start;justify-content:center}
.burst span{font-weight:800;color:#ff9500;text-shadow:0 0 2px #fff,0 0 2px #fff;font-size:15px}
@keyframes bs{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.4)}}

/* ===== パック開封演出 ===== */
.pko{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:700;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none}
.pkwrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.pkholder{position:relative;display:flex;align-items:center;justify-content:center;width:100%}
.pkstage{position:relative;flex:none}
.pkstage.ghost{position:absolute;left:50%;margin-left:0;top:0;translate:-50% 0}
.pkstack{position:absolute;left:50%;top:0;translate:-50% 0;pointer-events:none}
.pkholder>.pkstage{margin:0 auto}
.pklayer{position:absolute;inset:0}
.pklayer img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.pklayer.pkfb{background:#3a4152;border-radius:10px}
.pkline{position:absolute;height:3px;background:#fff;box-shadow:0 0 6px #fff;width:0;opacity:0}
.pkcard{position:absolute;left:50%;top:50%;translate:-50% -50%;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));pointer-events:none}
.pkhint{margin-top:18px;font-weight:700;font-size:1.05rem;text-align:center}.pkhint.y{color:#ffd60a;margin-top:0}
.pktitle{font-weight:700;font-size:1.25rem}
.cfront{border-radius:16px;background:#fff;box-shadow:0 5px 10px rgba(0,0,0,.6);overflow:hidden}
.cfront .cimg{border-radius:16px;height:100%;box-shadow:none}
.cstage{position:relative;touch-action:none}
.cslot{position:absolute;inset:0;will-change:transform}
.burst{position:absolute;left:50%;top:50%;width:0;height:0;z-index:999;pointer-events:none}
.bpart{position:absolute;border-radius:2px;left:0;top:0;margin:-4px}
.bray{position:absolute;left:0;top:0;transform-origin:0 50%}
.bring{position:absolute;left:0;top:0;border:5px solid;border-radius:50%;translate:-50% -50%}
.bflash{position:fixed;inset:0;background:#fff;z-index:850;pointer-events:none;opacity:0}
.pkb2{font:inherit;color:#aaa;background:transparent;border:0;cursor:pointer;padding:6px 14px}
.pkb2.purple{color:#fff;background:#af52de;border-radius:8px;font-weight:700;font-size:.9rem}

/* ===== フレンド・チャット ===== */
.msgs{max-height:48vh;min-height:140px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:6px 0}
.msg{display:flex}.msg.own{justify-content:flex-end}
.bub{max-width:80%;background:var(--bg);border-radius:12px;padding:6px 10px}
.msg.own .bub{background:var(--mirbg)}
.mh{font-size:.7rem;color:var(--mute)}.mh .lnkbtn{font-size:.7rem}
.mt{white-space:pre-wrap;word-break:break-word}
.frow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:#aaa;display:inline-block}.dot.on{background:#34c759}

/* ===== 仕上げ（iOS風） ===== */
:root{--radius:14px}
body{-webkit-font-smoothing:antialiased;font-size:15px}
main{padding-top:10px}
.panel{border:0;border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.panel h2{font-size:1.25rem;letter-spacing:.01em}
.btn{border:0;border-radius:10px;padding:10px 18px;transition:transform .08s,opacity .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.sub{background:rgba(47,111,214,.12);color:var(--acc);border:0}
.btn.sm{padding:6px 12px;border-radius:8px}
input[type=text],input[type=search],select{border:0;background:rgba(120,120,128,.12);border-radius:10px;padding:9px 12px;color:var(--fg)}
select{padding-right:8px}
.yen{background:#fff;border-radius:999px;padding:3px 12px;box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:.82rem;color:var(--fg)!important}
@media (prefers-color-scheme:dark){.yen{background:#1c1c1e}.panel{box-shadow:none}}
.seg{display:inline-flex;background:rgba(120,120,128,.14);border-radius:10px;padding:2px;gap:2px;flex-wrap:wrap;max-width:100%}
.seg button{font:inherit;font-size:.9rem;font-weight:500;border:0;background:transparent;color:var(--fg);padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:700;color:#111}
@media (prefers-color-scheme:dark){.seg button.on{background:#636366;color:#fff}}
.grid .tile{background:var(--card);border-radius:12px;padding:6px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cimg{border-radius:8px}
.pkb{font-size:.72rem}
.decks .panel{padding:14px 16px}
.badge{font-weight:600}
dialog{border:0;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.fb{font-size:.7rem}
.cimg.nofb{background:transparent;box-shadow:none}.cimg.nofb .fb{display:none}
.lr{gap:12px;margin:2px 0 6px}.lr .lnkbtn{padding:10px 8px}
.endbtn{margin-bottom:6px}
.actbtn,.mbtn{touch-action:manipulation}

.field{gap:0}
.brow{display:flex;justify-content:center;align-items:flex-start;gap:6px;padding:2px 12px 0}
.arow{display:flex;align-items:flex-start;justify-content:center;padding:2px 12px 0}
.acenter{display:flex;justify-content:center;flex:0 0 auto;margin:0 4%}
.azone{flex:1;display:flex;justify-content:center;align-items:flex-start;min-width:0}
.piles{display:flex;gap:8px;align-items:flex-start}
.pile{position:relative;border-radius:5px;flex:none}
.pile.back{background:var(--cback) center/cover;box-shadow:2px 2px 0 #1b3c8a,4px 4px 0 rgba(0,0,0,.25)}
.pile.face{box-shadow:1px 1px 3px rgba(0,0,0,.4)}
.pile.face .cimg{border-radius:5px}
.pile.emp{border:1px dashed rgba(128,128,128,.6)}
.pile .pn{position:absolute;right:2px;bottom:2px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:0 6px;z-index:2}
.pl{display:block;font-size:10px;color:#8a8a90;white-space:nowrap}
.pile .pl{position:absolute;left:0;right:0;top:100%;text-align:center;margin-top:3px}
.prizes{display:grid;gap:3px;position:relative;padding-bottom:14px}
.prizes .pz{border-radius:3px;background:var(--cback) center/cover;box-shadow:1px 1px 2px rgba(0,0,0,.4)}
.prizes .pz.gone{background:none;box-shadow:none;border:1px dashed rgba(128,128,128,.4)}
.prizes .pl{position:absolute;left:0;right:0;bottom:0;text-align:center}
.pinfo{position:absolute;left:0;right:0;bottom:0;padding:10px 3px 3px;background:linear-gradient(transparent,rgba(0,0,0,.72));border-radius:0 0 6px 6px;color:#fff;pointer-events:none}
.pinfo .php{font-size:10px;margin:0;text-shadow:0 1px 2px #000}
.pinfo .hpbar{height:3px;margin:2px 0 0;background:rgba(255,255,255,.35)}
.pinfo .ecirc{min-height:0;gap:1px;margin-bottom:1px;flex-wrap:wrap}
.pinfo .ecirc span{width:13px;height:13px;font-size:8px}
.ptile .php,.ptile .hpbar{width:auto}

.half{display:flex;justify-content:space-between;align-items:flex-start}
.hcen{flex:1;display:flex;flex-direction:column;min-width:0}
.hz{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
.piles{flex-direction:column;align-items:center;gap:0}
.piles .endbtn{width:100%;padding:4px;font-size:.8rem;margin:0 0 4px}
.prizes{display:grid;padding-bottom:0}
.prizes .pz{box-shadow:1px 1px 3px rgba(0,0,0,.45)}
.prizes .pl{bottom:-16px}
.strip{height:28px;gap:10px;justify-content:flex-start}
.strip .chip{margin-left:auto}
.half.mine .hz{justify-content:flex-end;padding-bottom:6px}.half.opp .hz{justify-content:flex-start;padding-top:6px}
.handov{position:absolute;left:0;right:0;bottom:0;z-index:20;background:rgba(20,20,30,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:14px 14px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.3)}
.handov.hdrag{opacity:.18}
.handbtn{margin-left:auto;padding:4px 12px;font-size:.8rem}
.strip .chip{margin-left:0}
body.inbattle header.top{display:none}
html:has(body.inbattle){overflow:hidden;overscroll-behavior:none}
body.inbattle{position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none;padding-bottom:0;touch-action:manipulation}
body.inbattle .gchg{touch-action:pan-y}
.gch{position:fixed;inset:0;z-index:950;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom))}
.gchh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:4px 2px 10px;font-size:1rem}
.gchc{font-size:.85rem;color:var(--mute);white-space:nowrap}
.gchg{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;align-content:start;padding:4px 2px 12px;-webkit-overflow-scrolling:touch}
.gci{position:relative;border-radius:8px;cursor:pointer;outline:3px solid transparent;touch-action:manipulation}
.gci img,.gci canvas{width:100%;height:auto;display:block;border-radius:8px}
.gci.off{opacity:.3;cursor:default}
.gci.on{outline-color:var(--acc)}
.gcn{position:absolute;left:6px;top:6px;min-width:26px;height:26px;border-radius:13px;background:var(--acc);color:var(--accfg);font-weight:700;display:none;align-items:center;justify-content:center;font-size:.9rem;padding:0 6px}
.gci.on .gcn{display:flex}
.gcz{position:absolute;right:4px;bottom:4px;border:0;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.85rem;padding:3px 7px}
.gchf{display:flex;gap:10px;justify-content:center;padding-top:8px}
.gchf .btn{min-width:140px}
.handfan{position:absolute;left:0;right:0;bottom:0;z-index:20;pointer-events:none;overflow:visible}
.handfan .hcard.fan{position:absolute;opacity:1;pointer-events:auto;box-shadow:0 2px 8px rgba(0,0,0,.45);transition:transform .12s,bottom .12s}
.handfan .hcard.fan:not(.usable){filter:brightness(.8)}
.handfan.hdrag{opacity:.2}
.handfan.hdrag .hcard{pointer-events:none}
.hcard.fan.dragging{opacity:.25}
.gcz.dz{top:4px;bottom:auto;right:4px}
.handfan .hcard.fan{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.handfan .hcard.fan.pk{filter:brightness(1.25);outline:3px solid #ffd54a;border-radius:6px}
.hpeek{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:200;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.hpimg{width:min(52vw,300px,42vh*0.716);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.7);overflow:hidden}
.hpimg img,.hpimg>*{width:100%;display:block}
.hptxt{background:rgba(0,0,0,.78);color:#fff;padding:5px 12px;border-radius:14px;font-size:.9rem;max-width:90vw;text-align:center}
.fxcard{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:180;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;animation:fxin .18s ease-out}
.fxcard.out{opacity:0;transition:opacity .3s}
.fximg{width:min(30vw,220px,34vh*0.716);border-radius:9px;box-shadow:0 8px 34px rgba(0,0,0,.75);overflow:hidden;border:3px solid #4fc3f7}
.fxcard.opp .fximg{border-color:#ef5350}
.fximg img,.fximg>*{width:100%;display:block}
.fxtxt{background:rgba(0,0,0,.8);color:#fff;padding:5px 12px;border-radius:14px;font-size:.95rem;text-align:center;max-width:80vw}
@keyframes fxin{from{opacity:0;transform:translate(-50%,-44%) scale(.9)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.colprog{background:var(--card,rgba(255,255,255,.05));border-radius:10px;padding:8px 12px;margin:8px 0}
.colprog summary{cursor:pointer}
.pgbar{height:8px;border-radius:4px;background:rgba(127,127,127,.25);overflow:hidden;margin-top:3px}
.pgbar i{display:block;height:100%;background:#4caf50}
.btn.on{outline:2px solid #ffd54a}
.ovl img{-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
.cnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.zoom.slidein-r{animation:slr .18s ease-out}.zoom.slidein-l{animation:sll .18s ease-out}
@keyframes slr{from{opacity:.2;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes sll{from{opacity:.2;transform:translateX(-40px)}to{opacity:1;transform:none}}
.favstar{position:absolute;right:4px;top:2px;color:#f5b400;text-shadow:0 0 3px #000,0 0 2px #000;font-size:1.1rem;line-height:1;pointer-events:none;z-index:3}
.rbadge{position:absolute;left:4px;top:4px;font-weight:800;font-size:.68rem;border-radius:6px;padding:1px 6px;color:#fff;background:#546e7a;box-shadow:0 1px 3px rgba(0,0,0,.4);pointer-events:none}
.rbadge.r3{background:#2e7d32}.rbadge.r4,.rbadge.r5{background:#1565c0}.rbadge.r6{background:#6a1b9a}.rbadge.r7{background:#e65100}
.rbadge.r8{background:linear-gradient(90deg,#f9a825,#e91e63);}
.hibox{margin:10px 0;padding:10px;border-radius:12px;background:linear-gradient(135deg,rgba(255,193,7,.18),rgba(233,30,99,.12));border:1px solid rgba(255,193,7,.5)}
.hiT{font-weight:800;margin-bottom:6px}
</style>

function drawArt(cf,r){

function drawCOrU(cf){return Math.random()*100<cf.cRatio?{art:drawArt(cf,"C"),rarity:"C"}:{art:drawArt(cf,"U"),rarity:"U"}}
// M1Lスタイル：1パック（5枚）。rare が null なら5枚ともC/U
function genM1LPack(cf,rare,exBox){
  var used={},pack=[];
  function cu(){var c=drawCOrU(cf);while(used[c.art])c=drawCOrU(cf);used[c.art]=1;return c}
  if(rare){
    var r=drawArt(cf,rare),g=0;
    while((used[r]||exBox[r])&&g<200){r=drawArt(cf,rare);g++}
    used[r]=1;exBox[r]=1;
    pack.push(cu(),cu(),cu(),{art:r,rarity:rare},cu());
  }else for(var i=0;i<5;i++)pack.push(cu());
  return pack;
}
function genM1LBox(cf){
  var slots=[],rr=cf.rrBox;if(Math.random()*100<cf.rrExtra)rr++;
  slots=slots.concat(rep("RR",rr),rep("AR",cf.arBox),["SR_Goods"]);
  var three=Math.random()*100<cf.three,extra=rep("SR_Pokemon",three?2:1),cur=0;
  if(Math.random()*100<cf.murP&&cur<extra.length){extra[cur]="MUR";cur++}
  if(Math.random()*100<cf.sarP&&cur<extra.length){extra[cur]="SAR";cur++}
  slots=slots.concat(extra,rep("R",5));
  if(slots.length<cf.ppb)slots=slots.concat(rep(null,cf.ppb-slots.length));
  else if(slots.length>cf.ppb){shuffle(slots);slots=slots.slice(0,cf.ppb)}
  shuffle(slots);
  var ex={},out=[];slots.forEach(function(r){out=out.concat(genM1LPack(cf,r,ex))});return out;
}
function genM1LSingle(cf){
  var avgRR=cf.rrBox+cf.rrExtra/100,avgAR=cf.arBox,avgG=1,avgR=5;
  var slots=1+cf.three/100,avgMUR=Math.min(cf.murP/100,slots),avgSAR=Math.min(cf.sarP/100,Math.max(slots-avgMUR,0)),avgSRP=Math.max(slots-avgMUR-avgSAR,0);
  var plain=Math.max(cf.ppb-(avgRR+avgAR+avgG+avgSRP+avgSAR+avgMUR+avgR),0);
  return genM1LPack(cf,pickWeighted([["MUR",avgMUR],["SAR",avgSAR],["SR_Pokemon",avgSRP],["SR_Goods",avgG],["RR",avgRR],["AR",avgAR],["R",avgR],[null,plain]]),{});
}
function pickWeighted(w){var t=0;w.forEach(function(x){t+=x[1]});var roll=Math.random()*Math.max(t,1);for(var i=0;i<w.length;i++){if(roll<w[i][1])return w[i][0];roll-=w[i][1]}return null}
// ドリームスタイル（M2a）：C/U×(枚数-4-ミラー)→ミラー(ARなしのとき)→R×2→RR→ヒット枠(無ければR)
function dreamSR(cf){return Math.floor(Math.random()*Math.max(cf.srG+cf.srP,1))<cf.srG?"SR_Goods":"SR_Pokemon"}
function genDreamPack(cf,hit,exBox){
  var used={},pack=[];
  function add(r,avoidBox){
    var a=drawArt(cf,r),g=0;
    while((used[a]||(avoidBox&&exBox[a]))&&g<200){a=drawArt(cf,r);g++}
    used[a]=1;if(avoidBox)exBox[a]=1;pack.push({art:a,rarity:r});
  }
  var hasMir=cf.mirror>0&&hit!=="AR",n=Math.max(cf.cards-4-(hasMir?1:0),0);
  for(var i=0;i<n;i++){var c=drawCOrU(cf),g=0;while(used[c.art]&&g<200){c=drawCOrU(cf);g++}used[c.art]=1;pack.push(c)}
  if(hasMir)add("MIR",false);
  add("R",false);add("R",false);add("RR",true);
  if(hit)add(hit,true);else add("R",false);
  return pack;
}
function genDreamBox(cf){
  var hits=rep("AR",cf.arBox).concat(rep("MA",cf.maBox));
  for(var i=0;i<cf.srBox;i++)hits.push(dreamSR(cf));
  var roll=Math.random()*100;
  if(roll<cf.murP)hits.push("MUR");else if(roll<cf.murP+cf.sarP)hits.push("SAR");
  shuffle(hits);var slots=hits.slice(0,cf.ppb);while(slots.length<cf.ppb)slots.push(null);shuffle(slots);
  var ex={},out=[];slots.forEach(function(h){out=out.concat(genDreamPack(cf,h,ex))});return out;
}
function genDreamSingle(cf){
  var avgMUR=cf.murP/100,avgSAR=cf.sarP/100,t=Math.max(cf.srG+cf.srP,1),avgG=cf.srBox*cf.srG/t,avgP=cf.srBox*cf.srP/t,avgAR=cf.arBox,avgMA=cf.maBox;
  var plain=Math.max(cf.ppb-(avgMUR+avgSAR+avgG+avgP+avgAR+avgMA),0);
  return genDreamPack(cf,pickWeighted([["MUR",avgMUR],["SAR",avgSAR],["MA",avgMA],["SR_Pokemon",avgP],["SR_Goods",avgG],["AR",avgAR],[null,plain]]),{});
}
function genPacks(cf,mode){ // mode 0=1パック 1=ボックス 2=カートン
  if(mode===0)return cf.dream?genDreamSingle(cf):genM1LSingle(cf);
  var out=[],n=mode===1?1:cf.bpc;
  for(var i=0;i<n;i++)out=out.concat(cf.dream?genDreamBox(cf):genM1LBox(cf));
  return out;
}

function tokOf(k){var m;if(k.indexOf("E:")===0)return "e"+k.slice(2);if(m=/^SD100_N_(\d+)$/.exec(k))return "n"+m[1];if(m=/^SD100_M_(\d+)$/.exec(k))return "m"+m[1];return k}
function keyOf(t){var m;if(t.charAt(0)==="e"&&/^e[a-z]+$/.test(t))return "E:"+t.slice(1);if(m=/^n(\d+)$/.exec(t))return "SD100_N_"+m[1];if(m=/^m(\d+)$/.exec(t))return "SD100_M_"+m[1];return t}
function deckToCode(d){return "PKD1:"+encodeURIComponent(d.name||"デッキ")+";"+Object.keys(d.items).map(function(k){return tokOf(k)+"*"+d.items[k]}).join(",")}
function parseDeckCode(code){
  code=String(code||"").trim();if(code.indexOf("PKD1:")!==0)return null;
  var body=code.slice(5),i=body.indexOf(";");if(i<0)return null;
  var name;try{name=decodeURIComponent(body.slice(0,i))}catch(e){name="デッキ"}
  var items={},total=0;
  body.slice(i+1).split(",").forEach(function(p){var m=/^([^*]+)\*(\d+)$/.exec(p);if(!m)return;var k=keyOf(m[1]),n=+m[2];if(n<=0||n>60)return;if(k.indexOf("E:")===0){if(!TYPES.some(function(t){return "E:"+t[0]===k}))return}else if(!ART[k])return;items[k]=(items[k]||0)+n;total+=n});
  if(!total)return null;
  return {name:name.slice(0,30)||"デッキ",items:items,total:total};
}
// 持っているカードの範囲で作る。持っていないカードは、同じカードの別の絵(持っていれば)で置きかえる。足りない分は一覧にする
function importDeckCode(code){
  var pd=parseDeckCode(code);if(!pd)return null;
  var used={},items={},miss=[],nameCnt={},ace=0;
  function take(k,n){var got=0,a=ART[k];
    var cands=[k];Object.keys(ART).forEach(function(x){if(x!==k&&ART[x].id===a.id&&ART[x].kind!=="e")cands.push(x)});
    for(var ci=0;ci<cands.length&&got<n;ci++){var c=cands[ci],have=(S.owned[c]||0)-(used[c]||0);
      while(have>0&&got<n){
        if(a.kind!=="e"){if((nameCnt[a.name]||0)>=4)break;if(ACE[a.id]&&ace>=1)break}
        used[c]=(used[c]||0)+1;items[c]=(items[c]||0)+1;got++;have--;nameCnt[a.name]=(nameCnt[a.name]||0)+1;if(ACE[a.id])ace++}}
    return got}
  Object.keys(pd.items).forEach(function(k){
    var n=pd.items[k];
    if(k.indexOf("E:")===0){items[k]=(items[k]||0)+n;return}
    var g=take(k,n);if(g<n)miss.push(ART[k].name+" ×"+(n-g))});
  return {name:pd.name,items:items,missing:miss,total:pd.total};
}

var _fxT=null,_fxEl=null;
function fxFind(g,name){
  var f=null;
  [0,1].forEach(function(p){var pl=g.players[p];
    if(pl.active&&pl.active.name===name)f=f||pl.active.top;
    pl.bench.forEach(function(x){if(x.name===name)f=f||x.top});
    for(var i=pl.discard.length-1;i>=0&&!f;i--)if(pl.discard[i].name===name)f=pl.discard[i];
    pl.hand.forEach(function(c){if(!f&&c.name===name)f=c})});
  if(!f&&g.stadiumCard&&g.stadiumCard.name===name)f=g.stadiumCard;
  return f;
}
var _fxCache={};
function fxRemember(g){try{[0,1].forEach(function(p){var pl=g.players[p];pl.hand.forEach(function(c){_fxCache[c.name]=c})})}catch(e){}}
function fxLog(g,t){
  if(!UI.fx||!B.running||B.replaying){return}
  var m,who=null,card=null,label="";
  function owner(p){return p===(B.me||0)?"あなた":"相手"}
  if(m=/^プレイヤー(\d)は「(.+)」を使った$/.exec(t)){who=+m[1]-1;card=m[2];label="「"+card+"」を使った"}
  else if(m=/^⚔️ プレイヤー(\d)の(.+)の「(.+)」$/.exec(t)){who=+m[1]-1;card=m[2];label=card+"の「"+m[3]+"」"}
  else if(m=/^(.+)の特性「(.+)」を使った$/.exec(t)){who=g.currentPlayer;card=m[1];label=card+"の特性「"+m[2]+"」"}
  else if(m=/^(.+)が(.+)に進化した$/.exec(t)){who=g.currentPlayer;card=m[2];label=m[1]+"が"+card+"に進化"}
  else return;
  var c=null;try{c=fxFind(g,card)||_fxCache[card]||null}catch(e){}
  fxShow(c,owner(who)+"："+label,who!==(B.me||0));
}

function handDragStart(ev,i0,c0,el0){

  function listOf(i){var l=[];myActs().forEach(function(a,k){if(a.handIndex===i)l.push({a:a,i:k})});return l}
  function nearest(x){var best=cur,bd=1e9;cards.forEach(function(n,k){var r=n.getBoundingClientRect(),d=Math.abs(x-(r.left+r.width/2));if(d<bd){bd=d;best=k}});return best}
  function showPeek(){

    if(!peek){peek=document.createElement("div");peek.className="hpeek";document.body.appendChild(peek)}
    peek.innerHTML="";var im=document.createElement("div");im.className="hpimg";im.appendChild(cardFace(c));peek.appendChild(im);
    var l=listOf(cur),t=document.createElement("div");t.className="hptxt";

  function startDrag(e){

    if(fan)fan.classList.add("hdrag");

}

    case"opp":this.opp={name:m.name,rating:m.rating};this.onChange();break;

    case"created":this.haveRoom=true;this.room=m.room;this.token=m.token;this.seat=m.seat|0;this.phase="waiting";this.setStatus(this.isRandom?"対戦相手を探しています…":"相手が入るのを待っています…");break;
    case"joined":this.haveRoom=true;this.room=m.room;this.token=m.token;this.seat=m.seat|0;this.phase="waiting";this.setStatus("接続しました");break;
    case"queued":this.phase="waiting";this.setStatus(this.isRank?"ランクマッチの相手を探しています…（レートの近い人と組みます。待つほど範囲が広がります）":"対戦相手を探しています…（同じように探している人と自動で組みます）");break;

    case"peer":this.setStatus(m.online===false?"相手の接続が切れています…（最大150秒待ちます）":null);break;
    case"msg":{var n=m.n|0;if(n!==this.rx)return;this.rx++;this.push({message:m.d});break}

OnlineSession.prototype.send=function(d){if(this.ended)return;var s=JSON.stringify({t:"msg",n:this.tx.length,d:d});this.tx.push(s);if(this.persist)resumeSave(this);if(this.ready)this.rawSend(s)};

function syncHash(g){
  var h=0x811c9dc5;function mix(v){h^=(v|0);h=Math.imul(h,16777619)>>>0}
  mix(g.turnNumber);mix(g.currentPlayer);mix(g.stadiumCard?g.stadiumCard.id:-1);
  for(var p=0;p<2;p++){var s=g.players[p];mix(s.deck.length);mix(s.discard.length);mix(s.prizes.length);mix(s.hand.length);s.hand.forEach(function(c){mix(c.id)});
    if(s.active){mix(s.active.id);mix(s.active.damage);mix(s.active.attachedEnergy.length)}else mix(-1);
    s.bench.forEach(function(b){mix(b.id);mix(b.damage);mix(b.attachedEnergy.length)})}
  return h>>>0;
}
function deckToWire(d){return{cards:d.cards.map(function(c){return[c.cardNumber,c.count]}),energy:d.energy.map(function(e){return[e.type,e.count]}),arts:d.arts||{}}}
function deckFromWire(w){
  if(!w||!Array.isArray(w.cards)||!Array.isArray(w.energy))return null;
  var cards=[],energy=[];
  for(var i=0;i<w.cards.length;i++){var c=w.cards[i];if(!Array.isArray(c)||c.length!==2||!(c[1]>=0&&c[1]<=60))return null;cards.push({cardNumber:+c[0],count:+c[1]})}
  for(var j=0;j<w.energy.length;j++){var e=w.energy[j];if(!Array.isArray(e)||e.length!==2||typeof e[0]!=="string"||!(e[1]>=0&&e[1]<=60))return null;energy.push({type:e[0],count:+e[1]})}
  var arts={};if(w.arts&&typeof w.arts==="object")Object.keys(w.arts).forEach(function(k){if(/^[A-Za-z0-9_:]{1,48}$/.test(k))arts[k]=+w.arts[k]||0});
  return{cards:cards,energy:energy,arts:arts};
}


// ---------- 対戦の途中復帰（クラッシュ・再読み込みしても続きから） ----------
// 対戦の途中経過（部屋の合言葉・自分の操作の記録）をこの端末に保存しておく。戻ったら、サーバーが覚えている相手の操作と合わせて、最初から素早く再現して続きにつなぐ。
var RESUME_KEY="pk_resume",RESUME_MAXAGE=8*60*1000;
function resumeSave(s){try{localStorage.setItem(RESUME_KEY,JSON.stringify({room:s.room,token:s.token,seat:s.seat,isRank:!!s.isRank,isRandom:!!s.isRandom,deck:s.mineWire,tx:s.tx,at:Date.now()}))}catch(e){}}
function resumeClear(){try{localStorage.removeItem(RESUME_KEY)}catch(e){}}
function resumeLoad(){try{var r=JSON.parse(localStorage.getItem(RESUME_KEY)||"null");if(!r||!r.room||!r.token||!Array.isArray(r.tx)||!r.deck)return null;if(Date.now()-(r.at||0)>RESUME_MAXAGE){resumeClear();return null}return r}catch(e){return null}}
function resumeStart(r){

  var s=new OnlineSession();B.os=s;B.osCode="";
  s.room=r.room;s.token=r.token;s.seat=r.seat|0;s.isRank=!!r.isRank;s.isRandom=!!r.isRandom;s.haveRoom=true;s.phase="ready";s.tx=r.tx.slice();s.rx=0;s.mineWire=r.deck;s.persist=true;s._fired=true;

  s.onChange=function(){if(!B.running&&!$("t-battle").hidden)renderBattle()};
  if(s.isRank){B.rankNote=null;s.onRdone=function(d){B.rankNote=d.ok?"レート "+d.before+" → "+d.rating+"（"+(d.delta>=0?"+":"")+d.delta+"）　"+d.w+"勝"+d.l+"敗"+(d.d?d.d+"分":""):d.m;if(FR.status==="online")frSend({t:"rank"});draw()}}
  engineLoad(function(err){
    if(err){resumeClear();toast("復帰できませんでした");return}

    onlineBegin(s,mine,{resume:true});
  });
}
function checkResume(){

function onlineWait(el){

function onlineBegin(s,mine,opts){
  var seat=s.seat,seed=0,resume=!!(opts&&opts.resume),decs=[];
  if(resume){
    try{var all=s.tx.map(function(x){return JSON.parse(x).d});
      if(seat===0)seed=Number(all[0].seed)>>>0;
      decs=all.slice(1)}catch(e){s.finish({ended:"failed",m:"復帰できませんでした"});return}
  }else{
    var hello={k:"hello",dv:WEB_DV,deck:deckToWire(mine),name:myName()||"あなた"};
    if(seat===0){seed=(Math.random()*4294967296)>>>0;hello.seed=String(seed)}
    s.mineWire=deckToWire(mine);s.persist=true;
    s.send(hello);
  }
  var ri=0;B.replaying=resume&&decs.length>0;
  function chk(){if(B.replaying&&ri>=decs.length&&!s.q.length){B.replaying=false;draw()}}
  s.next().then(function(ev){
    if(ev.ended){B.os=null;B.result={win:false,text:onlineEndText(ev)};B.running=false;draw();return}
    var d=ev.message;
    function abort(m){s.finish({ended:"failed",m:m})}
    if(!d||d.k!=="hello"||typeof d.dv!=="string"){abort("相手のデータを読めませんでした");return}
    if(d.dv!==WEB_DV){abort("相手とカードデータの版が違います。両方が同じ版のサイトを開いてください");return}
    var pd=deckFromWire(d.deck);if(!pd||PK.DeckList.validate(pd).length){abort("相手のデッキがルールに合っていません");return}
    if(seat!==0){seed=Number(d.seed);if(!isFinite(seed)){abort("相手のデータを読めませんでした");return}seed=seed>>>0}
    B.oppName=String(d.name||"相手").slice(0,12);
    var deck0=PK.DeckList.makeBattleCards(seat===0?mine:pd,0,true),deck1=PK.DeckList.makeBattleCards(seat===0?pd:mine,1000,true);
    var human={chooseAction:function(g,p,acts){return new Promise(function(res){B.pending={type:"action",actions:acts,res:res};draw()})},
      choose:function(g,p,req){return new Promise(function(res){B.pending={type:"choice",req:req,res:res};draw()})}};
    var local={
      chooseAction:async function(g,p,acts){
        if(ri<decs.length){var d=decs[ri++];if(!d||d.k!=="a"||!(d.v>=0&&d.v<acts.length)){s.finish({ended:"failed",m:"復帰できませんでした（記録が合いません）"});if(g.result==null)g.result={draw:true};return acts.length-1}chk();return d.v}
        chk();var h=syncHash(g),i=await human.chooseAction(g,p,acts);if(!B.cancelled)s.send({k:"a",v:i,h:h});return i},
      choose:async function(g,p,req){
        if(ri<decs.length){var d=decs[ri++];if(!d||d.k!=="c"){s.finish({ended:"failed",m:"復帰できませんでした（記録が合いません）"});if(g.result==null)g.result={draw:true};return null}chk();return d.v<0?null:d.v}
        chk();var h=syncHash(g),a=await human.choose(g,p,req);if(!B.cancelled)s.send({k:"c",v:a==null?-1:a,h:h});return a}};
    async function recv(g,kind){
      var h=syncHash(g);B.waiting=true;draw();var e=await s.next();B.waiting=false;
      if(e.ended)return undefined;
      var m=e.message;
      if(!m||m.k!==kind||typeof m.v!=="number"){abort("通信の内容が合いませんでした");return undefined}
      if(typeof m.h==="number"&&m.h!==h){abort("相手との盤面がずれました（同期エラー）");return undefined}

    }
    var remote={
      chooseAction:async function(g,p,acts){
        var v=await recv(g,"a");

        if(B.replaying){chk();return v}
        if(v>=0&&v<acts.length&&acts[v].t!=="endTurn")toast("相手: "+g.describe(acts[v],p));
        draw();await sleep(600);return v;
      },
      choose:async function(g,p,req){
        var v=await recv(g,"c");
        if(v===undefined||B.cancelled){if(g.result==null)g.result={draw:true};return null}
        return v<0?null:v;
      }};
    var game=new PK.BattleGame(deck0,deck1,seat===0?[local,remote]:[remote,local],null,seed);
    B.game=game;B.me=seat;B.log=[];B.running=true;B.result=null;B.reward=null;B.pending=null;B.logOpen=false;B.cancelled=false;B.online=s;UI.lastTurn=-1;B.spec=null;specAnnounce(s.room);

// ---------- 観戦（フレンドの対戦を見る） ----------
// サーバーは2人分の操作の記録を頭から送ってくれる。こちらは同じ乱数の種と両方のデッキで対戦を再現し、あとは生中継の操作を受け取るだけ（操作はできない）
function specAnnounce(room){if(FR.status!=="online")return;if(room&&lsGet("pk_spec","1")==="0")return;frSend({t:"playing",room:room||""})}
function specStop(){
  var sp=B.spec;if(!sp)return;
  sp.stop=true;sp.over=true;try{sp.ws&&sp.ws.close()}catch(e){}
  [0,1].forEach(function(i){var w=sp.w[i];if(w){sp.w[i]=null;w(null)}});
  B.cancelled=true;B.spec=null;B.running=false;B.pending=null;B.waiting=false;B.game=null;B.result=null;draw();
}
function specStart(room,fname){
  if(B.running||B.os){toast("いまの対戦が終わってから観戦できます");return}
  engineLoad(function(err){
    if(err){toast("観戦を始められませんでした");return}
    var sp={room:room,ws:null,q:[[],[]],w:[null,null],cnt:[0,0],names:[fname||"先手","後手"],started:false,over:false,stop:false,tries:0,fast:0};
    B.spec=sp;B.os=null;B.online=null;
    showTab("battle");B.result=null;
    var el=$("t-battle");el.innerHTML="<div class='panel' style='text-align:center'><p>観戦の準備をしています…</p><button class='btn sub' id='sp-cancel'>やめる</button></div>";
    $("sp-cancel").onclick=function(){sp.stop=true;try{sp.ws&&sp.ws.close()}catch(e){}B.spec=null;renderBattle()};
    specOpen(sp);
  });
}
function specPush(sp,seat,d){var w=sp.w[seat];if(w){sp.w[seat]=null;w(d)}else sp.q[seat].push(d)}
function specNext(sp,seat){return new Promise(function(res){if(sp.q[seat].length)res(sp.q[seat].shift());else if(sp.over||sp.stop)res(null);else{sp.w[seat]=res;B.waiting=true;draw()}})}
function specFail(sp,m){if(sp.stop)return;sp.over=true;if(!sp.started){B.spec=null;toast(m);renderBattle();return}sp.err=m;[0,1].forEach(function(i){var w=sp.w[i];if(w){sp.w[i]=null;w(null)}})}
function specOpen(sp){
  var ws;try{ws=new WebSocket(wsBase())}catch(e){specFail(sp,"サーバーのアドレスが正しくありません");return}
  sp.ws=ws;wakeServer();
  ws.onopen=function(){ws.send(JSON.stringify({t:"spec",room:sp.room,ver:1}));sp.ping=setInterval(function(){if(ws.readyState===1)ws.send('{"t":"ping"}')},15000)};
  ws.onmessage=function(ev){var m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.t==="specok"){
      var L=m.logs;
      if(!sp.started){
        if(!L||!L[0]||!L[1]||!L[0].length||!L[1].length){specFail(sp,"対戦がまだ始まっていません");return}
        specBegin(sp,L[0][0],L[1][0]);
      }
      for(var s=0;s<2;s++)for(var i=Math.max(1,sp.cnt[s]);i<L[s].length;i++){specPush(sp,s,L[s][i])}
      for(var s2=0;s2<2;s2++)sp.cnt[s2]=Math.max(sp.cnt[s2],L[s2].length);
      sp.fast=sp.q[0].length+sp.q[1].length;
    }else if(m.t==="smsg"){
      var s3=m.s|0;if(s3<0||s3>1||m.n!==sp.cnt[s3])return;sp.cnt[s3]++;if(m.n>0)specPush(sp,s3,m.d);
    }else if(m.t==="sended"){specFail(sp,"対戦が終わりました")}
    else if(m.t==="error"){specFail(sp,m.m||"観戦できませんでした")}};
  ws.onclose=function(){clearInterval(sp.ping);if(sp.stop||sp.over||B.spec!==sp)return;
    if(++sp.tries>6){specFail(sp,"通信が切れました");return}setTimeout(function(){if(!sp.stop&&!sp.over&&B.spec===sp)specOpen(sp)},2000)};
  ws.onerror=function(){};

function specBegin(sp,h0,h1){

  var d0=deckFromWire(h0.deck),d1=deckFromWire(h1.deck);
  if(!d0||!d1||PK.DeckList.validate(d0).length||PK.DeckList.validate(d1).length){bad("デッキを読めませんでした");return}
  var seed=Number(h0.seed)>>>0;if(!isFinite(seed)){bad("対戦のデータを読めませんでした");return}
  sp.names=[String(h0.name||sp.names[0]).slice(0,12),String(h1.name||"相手").slice(0,12)];
  sp.started=true;
  function mk(seat){return{
    chooseAction:async function(g,p,acts){var m=await specNext(sp,seat);B.waiting=false;
      if(!m||sp.stop||sp.over&&!m){if(g.result==null)g.result={draw:true};return acts.length-1}
      if(m.k!=="a"||!(m.v>=0&&m.v<acts.length)){sp.err="記録が合いませんでした";sp.over=true;if(g.result==null)g.result={draw:true};return acts.length-1}

    choose:async function(g,p,req){var m=await specNext(sp,seat);B.waiting=false;
      if(!m||sp.stop){if(g.result==null)g.result={draw:true};return null}
      if(m.k!=="c"){sp.err="記録が合いませんでした";sp.over=true;if(g.result==null)g.result={draw:true};return null}

  var deck0=PK.DeckList.makeBattleCards(d0,0,true),deck1=PK.DeckList.makeBattleCards(d1,1000,true);
  var game=new PK.BattleGame(deck0,deck1,[mk(0),mk(1)],null,seed);
  B.game=game;B.me=0;B.log=[];B.running=true;B.result=null;B.reward=null;B.pending=null;B.logOpen=false;B.cancelled=false;B.online=null;B.os=null;UI.lastTurn=-1;
  game.onLog=function(t){B.log.push(t);try{fxLog(game,t);fxRemember(game)}catch(e){}draw()};
  game.run().then(function(r){
    if(B.spec!==sp)return;
    var txt=sp.err?"観戦を続けられませんでした（"+sp.err+"）":r.draw?"引き分け（または観戦が途中で終わりました）":(sp.names[r.win]+"の勝ち！（"+game.turnNumber+"ターン）");
    sp.over=true;try{sp.ws&&sp.ws.close()}catch(e){}
    B.spec=null;B.result={win:!sp.err&&!r.draw,text:txt};B.running=false;B.waiting=false;B.pending=null;draw()},
    function(e){if(B.spec!==sp)return;B.spec=null;B.running=false;B.result={win:false,text:"観戦中にエラー: "+e.message};draw()});
  draw();
}

// ---------- セーブ／ロード（書き換えにくい暗号化つき） ----------
// 中身はSHA-256で作った鍵ストリームで暗号化し、HMAC-SHA256の署名を付ける。1文字でも変えると読み込めない。
// ※ 画面のコードだけで動く仕組みなので、プログラムを読み解ける人には破られる。ふつうの書き換え（文字を直す）を防ぐためのもの
function bkSecret(){var a=["pk","·big","❖sv2","·","q7Zr","mA9x","†K3p","$4wL"];return new TextEncoder().encode(a.join("|")+(1234567*89).toString(36))}
function bkCat(){var n=0,i;for(i=0;i<arguments.length;i++)n+=arguments[i].length;var o=new Uint8Array(n),k=0;for(i=0;i<arguments.length;i++){o.set(arguments[i],k);k+=arguments[i].length}return o}
function bkSha(b){return crypto.subtle.digest("SHA-256",b).then(function(h){return new Uint8Array(h)})}
function bkStream(nonce,len){
  var n=Math.ceil(len/32),ps=[];
  for(var i=0;i<n;i++){var c=new Uint8Array([i>>>24,(i>>>16)&255,(i>>>8)&255,i&255]);ps.push(bkSha(bkCat(bkSecret(),nonce,c)))}
  return Promise.all(ps).then(function(hs){var o=new Uint8Array(len);hs.forEach(function(h,i){o.set(h.subarray(0,Math.min(32,len-i*32)),i*32)});return o});
}
function bkMac(nonce,cipher){
  return crypto.subtle.importKey("raw",bkSecret(),{name:"HMAC",hash:"SHA-256"},false,["sign"]).then(function(k){return crypto.subtle.sign("HMAC",k,bkCat(nonce,cipher))}).then(function(m){return new Uint8Array(m).subarray(0,16)});
}
function bkToB64(b){var s="";for(var i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s)}
function bkFromB64(t){var s=atob(t),o=new Uint8Array(s.length);for(var i=0;i<s.length;i++)o[i]=s.charCodeAt(i);return o}
function bkCollect(){var o={app:"pkbig",at:new Date().toISOString(),ls:{}};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("pk_")===0)o.ls[k]=localStorage.getItem(k)}}catch(e){}return o}
function bkEncode(){
  var plain=new TextEncoder().encode(JSON.stringify(bkCollect())),nonce=crypto.getRandomValues(new Uint8Array(16));
  return bkStream(nonce,plain.length).then(function(ks){
    var c=new Uint8Array(plain.length);for(var i=0;i<c.length;i++)c[i]=plain[i]^ks[i];
    return bkMac(nonce,c).then(function(mac){return "PKSV2."+bkToB64(bkCat(new Uint8Array([2]),nonce,mac,c))});
  });
}
function bkDecode(text){
  text=String(text||"").replace(/\s+/g,"");
  if(text.indexOf("PKSV2.")!==0)return Promise.reject(new Error("セーブコードではありません"));
  var b;try{b=bkFromB64(text.slice(6))}catch(e){return Promise.reject(new Error("セーブコードが壊れています"))}
  if(b.length<34||b[0]!==2)return Promise.reject(new Error("セーブコードが壊れています"));
  var nonce=b.subarray(1,17),mac=b.subarray(17,33),c=b.subarray(33);
  return bkMac(nonce,c).then(function(m2){
    var ok=m2.length===mac.length,d=0;for(var i=0;i<m2.length;i++)d|=m2[i]^mac[i];
    if(d!==0)throw new Error("コードが壊れているか、書き換えられています");
    return bkStream(nonce,c.length);
  }).then(function(ks){
    var p=new Uint8Array(c.length);for(var i=0;i<p.length;i++)p[i]=c[i]^ks[i];
    var o=JSON.parse(new TextDecoder().decode(p));
    if(!o||o.app!=="pkbig"||!o.ls||typeof o.ls!=="object")throw new Error("セーブコードの中身が正しくありません");
    var st=o.ls[KEY];if(st){var s2=JSON.parse(st);
      if(!s2||typeof s2.owned!=="object"||!isFinite(s2.yen)||s2.yen<0||s2.yen>1e9)throw new Error("セーブコードの中身が正しくありません");
      Object.keys(s2.owned).forEach(function(k){var v=s2.owned[k];if(!(Number.isInteger(v)&&v>=0&&v<=9999))throw new Error("セーブコードの中身が正しくありません")})}
    return o;
  });
}
function bkSupported(){return !!(window.crypto&&crypto.subtle&&window.TextEncoder)}

          Object.keys(o.ls).forEach(function(k){if(k.indexOf("pk_")===0&&typeof o.ls[k]==="string")localStorage.setItem(k,o.ls[k])})}catch(e){}
